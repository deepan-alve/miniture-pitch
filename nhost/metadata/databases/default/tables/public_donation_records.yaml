table:
  name: donation_records
  schema: public
object_relationships:
- name: ngo_partner
  using:
    foreign_key_constraint_on: ngo_partner_id
- name: return_request
  using:
    foreign_key_constraint_on: return_request_id
insert_permissions:
- role: ops
  permission:
    check: {}
    columns: '*'
select_permissions:
- role: ops
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
- role: parent
  permission:
    columns: '*'
    filter:
      return_request:
        account:
          auth_user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
update_permissions:
- role: ops
  permission:
    columns: '*'
    filter: {}
    check: {}
