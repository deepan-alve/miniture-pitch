table:
  name: store_credit_ledger
  schema: public
object_relationships:
- name: account
  using:
    foreign_key_constraint_on: account_id
select_permissions:
- role: ops
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
- role: parent
  permission:
    columns: '*'
    filter:
      account:
        auth_user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
