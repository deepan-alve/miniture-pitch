table:
  name: owned_units
  schema: public
object_relationships:
- name: account
  using:
    foreign_key_constraint_on: account_id
- name: order_line_item
  using:
    foreign_key_constraint_on: order_line_item_id
- name: product
  using:
    foreign_key_constraint_on: product_id
select_permissions:
- role: ops
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
- role: parent
  permission:
    columns: '*'
    filter:
      account:
        auth_user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
update_permissions:
- role: ops
  permission:
    columns:
    - status
    - returned_at
    filter: {}
    check: {}
