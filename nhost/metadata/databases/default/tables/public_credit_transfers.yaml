table:
  name: credit_transfers
  schema: public
object_relationships:
- name: from_account
  using:
    foreign_key_constraint_on: from_account_id
- name: to_account
  using:
    foreign_key_constraint_on: to_account_id
select_permissions:
- role: ops
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
- role: parent
  permission:
    columns: '*'
    filter:
      _or:
      - from_account:
          auth_user_id:
            _eq: X-Hasura-User-Id
      - to_account:
          auth_user_id:
            _eq: X-Hasura-User-Id
    allow_aggregations: true
