table:
  name: child_profiles
  schema: public
object_relationships:
- name: account
  using:
    foreign_key_constraint_on: account_id
insert_permissions:
- role: parent
  permission:
    check:
      account:
        auth_user_id:
          _eq: X-Hasura-User-Id
    columns:
    - account_id
    - name
    - birth_date
select_permissions:
- role: ops
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
- role: parent
  permission:
    columns: '*'
    filter:
      account:
        auth_user_id:
          _eq: X-Hasura-User-Id
    allow_aggregations: true
update_permissions:
- role: parent
  permission:
    columns:
    - name
    - birth_date
    filter:
      account:
        auth_user_id:
          _eq: X-Hasura-User-Id
    check:
      account:
        auth_user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
- role: parent
  permission:
    filter:
      account:
        auth_user_id:
          _eq: X-Hasura-User-Id
